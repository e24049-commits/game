<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny FFA 25-Kill FPS - Ready Lobby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #dceeff;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 8px;
      user-select: none;
    }
    #top-wrap {
      width: 860px;
      max-width: 98vw;
      background: #ffffff;
      border: 1px solid #93c5fd;
      border-radius: 10px 10px 0 0;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    #leaderboard {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      overflow-x: auto;
      white-space: nowrap;
    }
    .lb-title {
      background: rgba(15, 23, 42, 0.25);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
    }
    .lb-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 13px;
    }
    .lb-item.me {
      background: #16a34a;
      color: #ffffff;
    }
    .lb-item.p2 {
      background: #7c3aed;
      color: #ffffff;
    }
    #hud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f0f9ff;
      border-top: 1px solid #bae6fd;
      font-weight: 700;
      font-size: 12.5px;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sens-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #93c5fd;
      font-size: 12px;
    }
    .sens-box input[type="range"] {
      width: 78px;
      accent-color: #0284c7;
      cursor: pointer;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    .btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .btn.secondary:hover { background: #cbd5e1; }
    .btn.start {
      background: #16a34a;
      color: #ffffff;
      padding: 10px 22px;
      font-size: 15px;
      border-radius: 8px;
    }
    .btn.start:hover { background: #15803d; }
    .accent-red { color: #dc2626; }
    .accent-green { color: #15803d; }
    .accent-blue { color: #0369a1; }

    #stage-wrap {
      position: relative;
      width: 860px;
      max-width: 98vw;
      aspect-ratio: 4 / 3;
      background: #38bdf8;
      border-left: 1px solid #93c5fd;
      border-right: 1px solid #93c5fd;
      border-bottom: 1px solid #93c5fd;
    }
    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      display: block;
    }

    #prepScreen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(2, 132, 199, 0.92) 0%, rgba(186, 230, 253, 0.96) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    .prep-card {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border: 2px solid #0284c7;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .prep-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .prep-header h2 {
      font-size: 18px;
      color: #0f172a;
    }
    .prep-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }
    .prep-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .icon-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      font-size: 20px;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn.selected {
      border-color: #0284c7;
      background: #e0f2fe;
      transform: scale(1.05);
    }
    .prep-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .prep-grid select, .prep-grid input {
      padding: 6px 8px;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      width: 100%;
    }
    .prep-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
      gap: 10px;
    }
    .prep-note {
      font-size: 11.5px;
      color: #475569;
      line-height: 1.4;
    }
    #help {
      margin-top: 7px;
      font-size: 12px;
      color: #1e293b;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="top-wrap">
    <div id="leaderboard">
      <span class="lb-title">25 KILLS</span>
      <div id="leaderboardItems" style="display:flex;gap:8px;"></div>
    </div>

    <div id="hud">
      <div class="hud-group">
        <div>HP: <span id="hpText" class="accent-green">100</span></div>
        <div>SMOKE [E]: <span id="smokeStatus" class="accent-blue">READY</span></div>
        <div>ROOM: <span id="roomBadge" class="accent-blue">SUN25</span></div>
      </div>
      <div class="hud-group">
        <label class="sens-box" title="マウス・視点回転の感度">
          <span>感度</span>
          <input id="sensSlider" type="range" min="0.2" max="3.0" step="0.05" value="1.0" />
          <span id="sensValue" class="accent-blue">1.00</span>
        </label>
        <button id="openPrepBtn" class="btn secondary" type="button">準備画面</button>
        <div id="status">準備中</div>
      </div>
    </div>
  </div>

  <div id="stage-wrap">
    <canvas id="game" width="860" height="645"></canvas>

    <!-- 準備画面 -->
    <div id="prepScreen">
      <div class="prep-card">
        <div class="prep-header">
          <h2>☀️ MATCH READY</h2>
          <span class="prep-badge">FFA ・ 先着25キル</span>
        </div>

        <div class="prep-row">
          <div>あなたのアイコン</div>
          <div id="p1IconPicker" class="icon-picker"></div>
        </div>

        <div class="prep-grid">
          <div class="prep-row">
            <label for="friendModeSelect">友達と遊ぶモード</label>
            <select id="friendModeSelect">
              <option value="solo_bot">1人＋ライバルBOT</option>
              <option value="local_2p">2人同席（1画面で一緒に参戦）</option>
            </select>
          </div>
          <div class="prep-row">
            <label for="roomCodeInput">カスタム部屋コード</label>
            <div style="display:flex;gap:5px;">
              <input id="roomCodeInput" type="text" maxlength="10" value="SUN25" />
              <button id="randomRoomBtn" class="btn secondary" type="button">生成</button>
            </div>
          </div>
        </div>

        <div id="p2IconRow" class="prep-row" style="display:none;">
          <div>友達 (P2) のアイコン</div>
          <div id="p2IconPicker" class="icon-picker"></div>
        </div>

        <div class="prep-footer">
          <div class="prep-note">
            回復パック: <b>+25 HP</b> ／ 終了後再戦: <b>[R]キー</b><br />
            P1: <b>WASD</b> / <b>マウス</b> / <b>左クリック</b> / <b>E</b>
          </div>
          <button id="startMatchBtn" class="btn start" type="button">MATCH START</button>
        </div>
      </div>
    </div>
  </div>

  <div id="help">
    P1: <b>WASD</b>移動 / <b>マウス</b>視点 / <b>左クリック</b>射撃 / <b>E</b>スモーク / <b>Space</b>ジャンプ ／ 終了後再戦: <b>Rキー</b><br />
    P2(2人同席時): <b>矢印キー</b>移動・回転 / <b>Enter</b>射撃 / <b>/</b>スモーク
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const leaderboardItemsEl = document.getElementById("leaderboardItems");
    const hpTextEl = document.getElementById("hpText");
    const smokeEl = document.getElementById("smokeStatus");
    const roomBadgeEl = document.getElementById("roomBadge");
    const statusEl = document.getElementById("status");
    const sensSlider = document.getElementById("sensSlider");
    const sensValueEl = document.getElementById("sensValue");

    const prepScreen = document.getElementById("prepScreen");
    const openPrepBtn = document.getElementById("openPrepBtn");
    const startMatchBtn = document.getElementById("startMatchBtn");
    const randomRoomBtn = document.getElementById("randomRoomBtn");
    const friendModeSelect = document.getElementById("friendModeSelect");
    const roomCodeInput = document.getElementById("roomCodeInput");
    const p1IconPicker = document.getElementById("p1IconPicker");
    const p2IconPicker = document.getElementById("p2IconPicker");
    const p2IconRow = document.getElementById("p2IconRow");

    const WIN_KILLS = 25;
    const BOT_COUNT = 6;
    const HEAL_AMOUNT = 25;
    const ICONS = ["⚡", "🔥", "🎯", "🛡️", "🦊", "🐺", "🦅", "🦁", "👾", "🤖"];
    const BOT_ICONS = ["🤖", "👾", "🦊", "🐺", "🦅", "🦁"];

    let selectedP1Icon = "⚡";
    let selectedP2Icon = "🔥";
    let isPrepOpen = true;

    function buildIconPickers() {
      p1IconPicker.innerHTML = "";
      p2IconPicker.innerHTML = "";
      ICONS.forEach(ic => {
        const b1 = document.createElement("button");
        b1.type = "button";
        b1.className = `icon-btn ${ic === selectedP1Icon ? "selected" : ""}`;
        b1.textContent = ic;
        b1.addEventListener("click", () => {
          selectedP1Icon = ic;
          buildIconPickers();
        });
        p1IconPicker.appendChild(b1);

        const b2 = document.createElement("button");
        b2.type = "button";
        b2.className = `icon-btn ${ic === selectedP2Icon ? "selected" : ""}`;
        b2.textContent = ic;
        b2.addEventListener("click", () => {
          selectedP2Icon = ic;
          buildIconPickers();
        });
        p2IconPicker.appendChild(b2);
      });
    }
    buildIconPickers();

    friendModeSelect.addEventListener("change", () => {
      p2IconRow.style.display = friendModeSelect.value === "local_2p" ? "flex" : "none";
    });

    randomRoomBtn.addEventListener("click", () => {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "FPS-";
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      roomCodeInput.value = code;
    });

    function openPrepScreen() {
      isPrepOpen = true;
      prepScreen.style.display = "flex";
      statusEl.textContent = "準備中";
      if (document.pointerLockElement === canvas && document.exitPointerLock) {
        document.exitPointerLock();
      }
    }

    openPrepBtn.addEventListener("click", e => {
      e.stopPropagation();
      openPrepScreen();
    });

    // 44x44 広々アリーナマップ
    const RAW_MAP = [
      "11111111111111111111111111111111111111111111",
      "10000000000000000000001100000000000000000001",
      "10000000000000000000001100000000000000000001",
      "10000020000000000000000000000000000000200001",
      "10000000000000000000000000000000000000000001",
      "10000000000000110000000000000011000000000001",
      "10000000000000110000000000000011000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000001100000000002200000000001100000001",
      "10000000001100000000002200000000001100000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000011000000000000000000000000000000110001",
      "10000011000000000000000000000000000000110001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000011000000110000000000000001",
      "10000000000000000011000000110000000000000001",
      "10000000000000000000002002000000000000000001",
      "11000000000000000000000000000000000000000011",
      "11000000000000000000000000000000000000000011",
      "10000000000000000000002002000000000000000001",
      "10000000000000000011000000110000000000000001",
      "10000000000000000011000000110000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000011000000000000000000000000000000110001",
      "10000011000000000000000000000000000000110001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000001100000000002200000000001100000001",
      "10000000001100000000002200000000001100000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000000000000000000000000000000001",
      "10000000000000110000000000000011000000000001",
      "10000000000000110000000000000011000000000001",
      "10000000000000000000000000000000000000000001",
      "10000020000000000000000000000000000000200001",
      "10000000000000000000001100000000000000000001",
      "10000000000000000000001100000000000000000001",
      "11111111111111111111111111111111111111111111"
    ];

    const MAP = RAW_MAP.map(row => row.split("").map(Number));
    const MAP_H = MAP.length;
    const MAP_W = MAP[0].length;
    const PLAYER_RADIUS = 0.28;

    let sensitivity = 1.0;
    try {
      const savedSens = localStorage.getItem("fps_sensitivity");
      if (savedSens) {
        const parsed = parseFloat(savedSens);
        if (!Number.isNaN(parsed) && parsed >= 0.2 && parsed <= 3.0) {
          sensitivity = parsed;
        }
      }
    } catch (_) {}
    sensSlider.value = sensitivity.toFixed(2);
    sensValueEl.textContent = sensitivity.toFixed(2);

    sensSlider.addEventListener("input", () => {
      sensitivity = parseFloat(sensSlider.value);
      sensValueEl.textContent = sensitivity.toFixed(2);
      try {
        localStorage.setItem("fps_sensitivity", sensitivity.toFixed(2));
      } catch (_) {}
    });
    sensSlider.addEventListener("mousedown", e => e.stopPropagation());
    sensSlider.addEventListener("click", e => e.stopPropagation());

    const player = {
      icon: "⚡",
      x: 22.5,
      y: 38.5,
      angle: -Math.PI / 2,
      z: 0,
      vz: 0,
      hp: 100,
      maxHp: 100,
      kills: 0,
      walkSpeed: 5.8,
      sprintSpeed: 8.6,
      baseRotSpeed: 2.2,
      bobPhase: 0,
      gunKick: 0
    };

    const p2 = {
      icon: "🔥",
      active: false,
      x: 20.5,
      y: 38.5,
      angle: -Math.PI / 2,
      hp: 100,
      kills: 0,
      smokeCooldown: 0,
      fireCooldown: 0
    };

    let rivals = [];
    let healthPacks = [];
    let smokes = [];
    let tracers = []; // { x1, y1, x2, y2, color, shooterIcon, life, maxLife }
    let lastHitBy = null; // { icon, angleDiff, life }
    let smokeCooldown = 0;
    let matchResult = null;
    let muzzleFlash = 0;
    let hitMarker = 0;
    let damageFlash = 0;
    let healFlash = 0;
    let roomCode = "SUN25";
    const keys = {};

    function isSolid(x, y) {
      const mx = Math.floor(x);
      const my = Math.floor(y);
      if (my < 0 || my >= MAP_H || mx < 0 || mx >= MAP_W) return true;
      return MAP[my][mx] > 0;
    }

    function resolveCircleCollision(pos, radius) {
      for (let pass = 0; pass < 2; pass++) {
        const minGx = Math.max(0, Math.floor(pos.x - radius - 1));
        const maxGx = Math.min(MAP_W - 1, Math.floor(pos.x + radius + 1));
        const minGy = Math.max(0, Math.floor(pos.y - radius - 1));
        const maxGy = Math.min(MAP_H - 1, Math.floor(pos.y + radius + 1));

        for (let gy = minGy; gy <= maxGy; gy++) {
          for (let gx = minGx; gx <= maxGx; gx++) {
            if (MAP[gy][gx] <= 0) continue;

            const closestX = Math.max(gx, Math.min(pos.x, gx + 1));
            const closestY = Math.max(gy, Math.min(pos.y, gy + 1));
            const dx = pos.x - closestX;
            const dy = pos.y - closestY;
            const distSq = dx * dx + dy * dy;

            if (distSq < radius * radius) {
              const dist = Math.sqrt(distSq);
              if (dist > 1e-6) {
                const overlap = radius - dist;
                pos.x += (dx / dist) * overlap;
                pos.y += (dy / dist) * overlap;
              } else {
                const centerX = gx + 0.5;
                const centerY = gy + 0.5;
                const pushX = pos.x - centerX;
                const pushY = pos.y - centerY;
                if (Math.abs(pushX) > Math.abs(pushY)) {
                  pos.x = (pushX >= 0 ? gx + 1 : gx) + (pushX >= 0 ? radius : -radius);
                } else {
                  pos.y = (pushY >= 0 ? gy + 1 : gy) + (pushY >= 0 ? radius : -radius);
                }
              }
            }
          }
        }
      }
    }

    function findSafeSpawn(minDistFromPlayer = 6) {
      for (let i = 0; i < 200; i++) {
        const gx = 2 + Math.floor(Math.random() * (MAP_W - 4));
        const gy = 2 + Math.floor(Math.random() * (MAP_H - 4));
        if (MAP[gy][gx] === 0) {
          const x = gx + 0.5;
          const y = gy + 0.5;
          if (Math.hypot(x - player.x, y - player.y) >= minDistFromPlayer) {
            return { x, y };
          }
        }
      }
      return { x: 22.5, y: 5.5 };
    }

    function respawnPlayer() {
      const spot = findSafeSpawn(8);
      player.x = spot.x;
      player.y = spot.y;
      player.z = 0;
      player.vz = 0;
      player.hp = player.maxHp;
      resolveCircleCollision(player, PLAYER_RADIUS);
    }

    function respawnP2() {
      const spot = findSafeSpawn(7);
      p2.x = spot.x;
      p2.y = spot.y;
      p2.hp = 100;
      resolveCircleCollision(p2, PLAYER_RADIUS);
    }

    function respawnRival(bot) {
      const spot = findSafeSpawn(7);
      bot.x = spot.x;
      bot.y = spot.y;
      bot.hp = 100;
      bot.patrolAngle = Math.random() * Math.PI * 2;
      bot.moveTimer = 1.6 + Math.random() * 2.2;
      bot.pauseTimer = 0.6 + Math.random() * 1.0;
      bot.fireCooldown = 1.1 + Math.random() * 0.9;
      resolveCircleCollision(bot, 0.26);
    }

    function spawnHealthPack(x, y) {
      let px = x;
      let py = y;
      if (isSolid(px, py)) {
        const spot = findSafeSpawn(0);
        px = spot.x;
        py = spot.y;
      }
      healthPacks.push({
        x: px,
        y: py,
        amount: HEAL_AMOUNT,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function isBlockedByWallOrSmoke(x1, y1, x2, y2) {
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const steps = Math.max(1, Math.floor(dist * 16));
      for (let s = 1; s < steps; s++) {
        const cx = x1 + ((x2 - x1) / steps) * s;
        const cy = y1 + ((y2 - y1) / steps) * s;
        if (isSolid(cx, cy)) return true;
        for (const sm of smokes) {
          if (Math.hypot(cx - sm.x, cy - sm.y) < sm.radius * 0.85) {
            return true;
          }
        }
      }
      return false;
    }

    function startMatchFromPrep() {
      player.icon = selectedP1Icon;
      p2.icon = selectedP2Icon;
      p2.active = friendModeSelect.value === "local_2p";
      roomCode = (roomCodeInput.value || "SUN25").trim().toUpperCase().slice(0, 10);
      roomBadgeEl.textContent = roomCode;

      player.x = 22.5;
      player.y = 38.5;
      player.angle = -Math.PI / 2;
      player.z = 0;
      player.vz = 0;
      player.hp = player.maxHp;
      player.kills = 0;
      player.bobPhase = 0;
      player.gunKick = 0;
      resolveCircleCollision(player, PLAYER_RADIUS);

      p2.x = 20.5;
      p2.y = 38.5;
      p2.angle = -Math.PI / 2;
      p2.hp = 100;
      p2.kills = 0;
      p2.smokeCooldown = 0;
      p2.fireCooldown = 0;
      if (p2.active) resolveCircleCollision(p2, PLAYER_RADIUS);

      const usedIcons = new Set([player.icon, ...(p2.active ? [p2.icon] : [])]);
      const pool = ICONS.filter(ic => !usedIcons.has(ic));

      rivals = [];
      for (let i = 0; i < BOT_COUNT; i++) {
        const spot = findSafeSpawn(10);
        const botIcon = pool[i % pool.length] || BOT_ICONS[i % BOT_ICONS.length];
        const bot = {
          icon: botIcon,
          x: spot.x,
          y: spot.y,
          hp: 100,
          kills: 0,
          patrolAngle: Math.random() * Math.PI * 2,
          moveTimer: 1.6 + Math.random() * 2.2,
          pauseTimer: 0.6 + Math.random() * 1.0,
          fireCooldown: 1.1 + Math.random() * 0.9
        };
        resolveCircleCollision(bot, 0.26);
        rivals.push(bot);
      }

      healthPacks = [];
      for (let i = 0; i < 4; i++) {
        const spot = findSafeSpawn(4);
        spawnHealthPack(spot.x, spot.y);
      }

      smokes = [];
      tracers = [];
      lastHitBy = null;
      smokeCooldown = 0;
      smokeEl.textContent = "READY";
      matchResult = null;
      muzzleFlash = 0;
      hitMarker = 0;
      damageFlash = 0;
      healFlash = 0;

      isPrepOpen = false;
      prepScreen.style.display = "none";
      updateHudAndLeaderboard();
      statusEl.textContent = "クリックでマウス視点開始";

      if (canvas.requestPointerLock) {
        try {
          canvas.requestPointerLock();
        } catch (_) {}
      }
    }

    startMatchBtn.addEventListener("click", startMatchFromPrep);

    function updateHudAndLeaderboard() {
      const currentHp = Math.max(0, Math.ceil(player.hp));
      hpTextEl.textContent = currentHp;
      hpTextEl.className = currentHp > 50 ? "accent-green" : currentHp > 25 ? "accent-red" : "accent-red";

      const entries = [
        { icon: player.icon, kills: player.kills, tag: "me" },
        ...(p2.active ? [{ icon: p2.icon, kills: p2.kills, tag: "p2" }] : []),
        ...rivals.map(b => ({ icon: b.icon, kills: b.kills, tag: "bot" }))
      ].sort((a, b) => b.kills - a.kills);

      leaderboardItemsEl.innerHTML = entries
        .map((item, idx) => {
          const cls = item.tag === "me" ? "lb-item me" : item.tag === "p2" ? "lb-item p2" : "lb-item";
          return `<span class="${cls}">${idx + 1} ${item.icon} ${item.kills}</span>`;
        })
        .join("");
    }

    function checkMatchEnd() {
      if (matchResult) return;
      if (player.kills >= WIN_KILLS) {
        matchResult = "WIN";
        updateHudAndLeaderboard();
        statusEl.textContent = `${player.icon} 勝利！（[R]キーで再戦）`;
        if (document.pointerLockElement === canvas && document.exitPointerLock) {
          document.exitPointerLock();
        }
        return;
      }
      if (p2.active && p2.kills >= WIN_KILLS) {
        matchResult = "P2_WIN";
        updateHudAndLeaderboard();
        statusEl.textContent = `${p2.icon} 勝利！（[R]キーで再戦）`;
        if (document.pointerLockElement === canvas && document.exitPointerLock) {
          document.exitPointerLock();
        }
        return;
      }
      if (rivals.some(b => b.kills >= WIN_KILLS)) {
        matchResult = "LOSE";
        updateHudAndLeaderboard();
        statusEl.textContent = "敗北（[R]キーで再戦）";
        if (document.pointerLockElement === canvas && document.exitPointerLock) {
          document.exitPointerLock();
        }
      }
    }

    function deploySmoke(actorX, actorY, actorAngle) {
      const dist = 4.5;
      let sx = actorX + Math.cos(actorAngle) * dist;
      let sy = actorY + Math.sin(actorAngle) * dist;
      if (isSolid(sx, sy)) {
        sx = actorX + Math.cos(actorAngle) * 1.6;
        sy = actorY + Math.sin(actorAngle) * 1.6;
      }
      smokes.push({ x: sx, y: sy, radius: 2.5, life: 9.0, maxLife: 9.0 });
    }

    function addTracer(x1, y1, x2, y2, color, shooterIcon) {
      tracers.push({
        x1,
        y1,
        x2,
        y2,
        color,
        shooterIcon,
        life: 0.22,
        maxLife: 0.22
      });
    }

    function recordAttackerDirection(attackerX, attackerY, attackerIcon) {
      let diff = Math.atan2(attackerY - player.y, attackerX - player.x) - player.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      lastHitBy = {
        icon: attackerIcon,
        angleDiff: diff,
        life: 1.1
      };
    }

    function playerShoot() {
      if (isPrepOpen || matchResult) return;
      muzzleFlash = 0.07;
      player.gunKick = 1.0;

      const candidateTargets = [
        ...rivals.map(b => ({ kind: "rival", ref: b, x: b.x, y: b.y, icon: b.icon })),
        ...(p2.active ? [{ kind: "p2", ref: p2, x: p2.x, y: p2.y, icon: p2.icon }] : [])
      ];

      let best = null;
      let bestAngleDiff = 0.095;

      for (const t of candidateTargets) {
        const dx = t.x - player.x;
        const dy = t.y - player.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.3 || dist > 38) continue;

        let angleToTarget = Math.atan2(dy, dx) - player.angle;
        while (angleToTarget > Math.PI) angleToTarget -= Math.PI * 2;
        while (angleToTarget < -Math.PI) angleToTarget += Math.PI * 2;

        if (Math.abs(angleToTarget) < bestAngleDiff) {
          if (!isBlockedByWallOrSmoke(player.x, player.y, t.x, t.y)) {
            bestAngleDiff = Math.abs(angleToTarget);
            best = t;
          }
        }
      }

      if (best) {
        addTracer(player.x, player.y, best.x, best.y, "#16a34a", player.icon);
        best.ref.hp -= 40;
        hitMarker = 0.14;
        if (best.ref.hp <= 0) {
          player.kills += 1;
          if (Math.random() < 0.7) {
            spawnHealthPack(best.ref.x, best.ref.y);
          }
          if (best.kind === "rival") {
            respawnRival(best.ref);
          } else {
            respawnP2();
          }
          updateHudAndLeaderboard();
          checkMatchEnd();
        }
      } else {
        const endX = player.x + Math.cos(player.angle) * 20;
        const endY = player.y + Math.sin(player.angle) * 20;
        addTracer(player.x, player.y, endX, endY, "#22c55e", player.icon);
      }
    }

    function p2Shoot() {
      if (!p2.active || isPrepOpen || matchResult || p2.fireCooldown > 0) return;
      p2.fireCooldown = 0.3;

      const candidateTargets = [
        ...rivals.map(b => ({ kind: "rival", ref: b, x: b.x, y: b.y, icon: b.icon })),
        { kind: "p1", ref: player, x: player.x, y: player.y, icon: player.icon }
      ];

      let best = null;
      let bestAngleDiff = 0.11;
      for (const t of candidateTargets) {
        const dx = t.x - p2.x;
        const dy = t.y - p2.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 0.3 || dist > 32) continue;

        let angleToTarget = Math.atan2(dy, dx) - p2.angle;
        while (angleToTarget > Math.PI) angleToTarget -= Math.PI * 2;
        while (angleToTarget < -Math.PI) angleToTarget += Math.PI * 2;

        if (Math.abs(angleToTarget) < bestAngleDiff && !isBlockedByWallOrSmoke(p2.x, p2.y, t.x, t.y)) {
          bestAngleDiff = Math.abs(angleToTarget);
          best = t;
        }
      }

      if (best) {
        addTracer(p2.x, p2.y, best.x, best.y, "#7c3aed", p2.icon);
        best.ref.hp -= 40;
        if (best.kind === "p1") {
          recordAttackerDirection(p2.x, p2.y, p2.icon);
        }
        if (best.ref.hp <= 0) {
          p2.kills += 1;
          if (Math.random() < 0.7) {
            spawnHealthPack(best.ref.x, best.ref.y);
          }
          if (best.kind === "rival") {
            respawnRival(best.ref);
          } else {
            respawnPlayer();
          }
          updateHudAndLeaderboard();
          checkMatchEnd();
        }
      } else {
        const endX = p2.x + Math.cos(p2.angle) * 18;
        const endY = p2.y + Math.sin(p2.angle) * 18;
        addTracer(p2.x, p2.y, endX, endY, "#8b5cf6", p2.icon);
      }
    }

    // 敵の動きをかなり落ち着かせた移動ロジック（巡回→一定時間停止して狙う）
    function moveBotCalmly(bot, speed, dt) {
      if (bot.pauseTimer > 0) {
        bot.pauseTimer -= dt;
        return;
      }
      bot.moveTimer -= dt;
      if (bot.moveTimer <= 0) {
        bot.patrolAngle += (Math.random() - 0.5) * Math.PI * 0.9;
        bot.moveTimer = 1.8 + Math.random() * 2.4;
        bot.pauseTimer = 0.7 + Math.random() * 1.1;
        return;
      }
      const prevX = bot.x;
      const prevY = bot.y;
      bot.x += Math.cos(bot.patrolAngle) * speed * dt;
      bot.y += Math.sin(bot.patrolAngle) * speed * dt;
      resolveCircleCollision(bot, 0.26);

      if (Math.hypot(bot.x - prevX, bot.y - prevY) < speed * dt * 0.25) {
        bot.patrolAngle += Math.PI * 0.65;
        bot.pauseTimer = 0.5;
      }
    }

    function updateRivalsAndPickups(dt) {
      for (let i = healthPacks.length - 1; i >= 0; i--) {
        const pack = healthPacks[i];
        pack.pulse += dt * 4.5;
        if (Math.hypot(player.x - pack.x, player.y - pack.y) < 0.75 && player.hp < player.maxHp) {
          player.hp = Math.min(player.maxHp, player.hp + pack.amount);
          healFlash = 0.25;
          healthPacks.splice(i, 1);
          updateHudAndLeaderboard();
          continue;
        }
        if (p2.active && Math.hypot(p2.x - pack.x, p2.y - pack.y) < 0.75 && p2.hp < 100) {
          p2.hp = Math.min(100, p2.hp + pack.amount);
          healthPacks.splice(i, 1);
        }
      }

      for (const bot of rivals) {
        moveBotCalmly(bot, 1.15, dt);
        bot.fireCooldown -= dt;

        const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (distToPlayer < 20 && bot.fireCooldown <= 0 && !isBlockedByWallOrSmoke(bot.x, bot.y, player.x, player.y)) {
          bot.fireCooldown = 1.25 + Math.random() * 0.85;
          addTracer(bot.x, bot.y, player.x, player.y, "#ef4444", bot.icon);
          if (Math.random() < 0.36) {
            player.hp -= 12;
            damageFlash = 0.24;
            recordAttackerDirection(bot.x, bot.y, bot.icon);
            if (player.hp <= 0) {
              bot.kills += 1;
              respawnPlayer();
            }
            updateHudAndLeaderboard();
            checkMatchEnd();
          }
        } else if (p2.active && bot.fireCooldown <= 0) {
          const distToP2 = Math.hypot(p2.x - bot.x, p2.y - bot.y);
          if (distToP2 < 18 && !isBlockedByWallOrSmoke(bot.x, bot.y, p2.x, p2.y)) {
            bot.fireCooldown = 1.3 + Math.random() * 0.8;
            addTracer(bot.x, bot.y, p2.x, p2.y, "#ef4444", bot.icon);
            if (Math.random() < 0.35) {
              p2.hp -= 12;
              if (p2.hp <= 0) {
                bot.kills += 1;
                respawnP2();
              }
              updateHudAndLeaderboard();
              checkMatchEnd();
            }
          }
        }

        if (bot.fireCooldown <= 0) {
          for (const other of rivals) {
            if (other === bot) continue;
            const d = Math.hypot(other.x - bot.x, other.y - bot.y);
            if (d < 16 && !isBlockedByWallOrSmoke(bot.x, bot.y, other.x, other.y)) {
              bot.fireCooldown = 1.4 + Math.random() * 0.9;
              addTracer(bot.x, bot.y, other.x, other.y, "#f97316", bot.icon);
              if (Math.random() < 0.32) {
                other.hp -= 35;
                if (other.hp <= 0) {
                  bot.kills += 1;
                  if (Math.random() < 0.5) spawnHealthPack(other.x, other.y);
                  respawnRival(other);
                  updateHudAndLeaderboard();
                  checkMatchEnd();
                }
              }
              break;
            }
          }
        }
      }
    }

    function update(dt) {
      for (const tr of tracers) tr.life -= dt;
      tracers = tracers.filter(tr => tr.life > 0);

      if (lastHitBy) {
        lastHitBy.life -= dt;
        if (lastHitBy.life <= 0) lastHitBy = null;
      }

      if (isPrepOpen || matchResult) return;

      if (muzzleFlash > 0) muzzleFlash -= dt;
      if (hitMarker > 0) hitMarker -= dt;
      if (damageFlash > 0) damageFlash -= dt;
      if (healFlash > 0) healFlash -= dt;
      if (player.gunKick > 0) player.gunKick = Math.max(0, player.gunKick - dt * 6.5);

      if (smokeCooldown > 0) {
        smokeCooldown = Math.max(0, smokeCooldown - dt);
        smokeEl.textContent = smokeCooldown > 0 ? `${smokeCooldown.toFixed(1)}s` : "READY";
      }

      for (const sm of smokes) sm.life -= dt;
      smokes = smokes.filter(sm => sm.life > 0);

      const rotSpeed = player.baseRotSpeed * sensitivity;

      if (p2.active) {
        if (p2.fireCooldown > 0) p2.fireCooldown = Math.max(0, p2.fireCooldown - dt);
        if (p2.smokeCooldown > 0) p2.smokeCooldown = Math.max(0, p2.smokeCooldown - dt);

        if (keys["ArrowLeft"]) p2.angle -= rotSpeed * dt;
        if (keys["ArrowRight"]) p2.angle += rotSpeed * dt;

        let p2Move = 0;
        if (keys["ArrowUp"]) p2Move += 1;
        if (keys["ArrowDown"]) p2Move -= 1;
        if (p2Move !== 0) {
          const vx = Math.cos(p2.angle) * p2Move * 5.4 * dt;
          const vy = Math.sin(p2.angle) * p2Move * 5.4 * dt;
          p2.x += vx;
          resolveCircleCollision(p2, PLAYER_RADIUS);
          p2.y += vy;
          resolveCircleCollision(p2, PLAYER_RADIUS);
        }
        if (keys["Enter"]) p2Shoot();
        if (keys["Slash"] && p2.smokeCooldown <= 0) {
          deploySmoke(p2.x, p2.y, p2.angle);
          p2.smokeCooldown = 6.0;
        }
      } else {
        if (keys["ArrowLeft"]) player.angle -= rotSpeed * dt;
        if (keys["ArrowRight"]) player.angle += rotSpeed * dt;
      }

      let forward = 0;
      let strafe = 0;
      if (keys["KeyW"]) forward += 1;
      if (keys["KeyS"]) forward -= 1;
      if (keys["KeyD"]) strafe += 1;
      if (keys["KeyA"]) strafe -= 1;

      const len = Math.hypot(forward, strafe);
      if (len > 0) {
        forward /= len;
        strafe /= len;
        const speed = (keys["ShiftLeft"] || keys["ShiftRight"]) ? player.sprintSpeed : player.walkSpeed;
        player.bobPhase += dt * speed * 2.2;

        const dirX = Math.cos(player.angle);
        const dirY = Math.sin(player.angle);
        const rightX = -dirY;
        const rightY = dirX;

        const vx = (dirX * forward + rightX * strafe) * speed * dt;
        const vy = (dirY * forward + rightY * strafe) * speed * dt;

        const totalMove = Math.hypot(vx, vy);
        const subSteps = Math.max(1, Math.ceil(totalMove / 0.1));
        for (let i = 0; i < subSteps; i++) {
          player.x += vx / subSteps;
          resolveCircleCollision(player, PLAYER_RADIUS);
          player.y += vy / subSteps;
          resolveCircleCollision(player, PLAYER_RADIUS);
        }
      } else {
        player.bobPhase += dt * 1.5;
        resolveCircleCollision(player, PLAYER_RADIUS);
      }

      if (keys["Space"] && player.z === 0) {
        player.vz = 5.4;
      }
      if (player.z > 0 || player.vz > 0) {
        player.z += player.vz * dt;
        player.vz -= 15.0 * dt;
        if (player.z <= 0) {
          player.z = 0;
          player.vz = 0;
        }
      }

      updateRivalsAndPickups(dt);
    }

    function drawWeapon(w, h) {
      const bobX = Math.cos(player.bobPhase) * 6;
      const bobY = Math.abs(Math.sin(player.bobPhase)) * 6;
      const kickX = player.gunKick * 16;
      const kickY = player.gunKick * 24;

      const baseX = w * 0.66 + bobX + kickX;
      const baseY = h * 0.82 + bobY + kickY;

      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.rotate(-0.08 + player.gunKick * 0.14);

      ctx.fillStyle = "#334155";
      ctx.fillRect(18, -78, 22, 62);
      ctx.fillStyle = "#64748b";
      ctx.fillRect(22, -78, 6, 62);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(15, -86, 28, 10);

      ctx.fillStyle = "#475569";
      ctx.fillRect(4, -28, 52, 68);

      ctx.fillStyle = "#0284c7";
      ctx.fillRect(10, -22, 6, 46);

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(18, -44, 24, 16);
      ctx.fillStyle = "#00e68a";
      ctx.fillRect(28, -40, 4, 5);

      ctx.fillStyle = "#1e293b";
      ctx.fillRect(14, 28, 24, 54);
      ctx.fillStyle = "#e2b49a";
      ctx.beginPath();
      ctx.arc(26, 36, 15, 0, Math.PI * 2);
      ctx.fill();

      if (muzzleFlash > 0) {
        ctx.fillStyle = "rgba(255, 245, 150, 0.95)";
        ctx.beginPath();
        ctx.moveTo(29, -86);
        ctx.lineTo(6, -124);
        ctx.lineTo(29, -108);
        ctx.lineTo(52, -124);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function drawPlayerHpBar(w, h) {
      const hpRatio = Math.max(0, Math.min(1, player.hp / player.maxHp));
      const barW = 220;
      const barH = 22;
      const x = w / 2 - barW / 2;
      const y = h - 42;

      ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
      ctx.fillRect(x - 6, y - 6, barW + 12, barH + 12);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
      ctx.strokeRect(x - 6, y - 6, barW + 12, barH + 12);

      const fillColor = hpRatio > 0.5 ? "#16a34a" : hpRatio > 0.25 ? "#eab308" : "#dc2626";
      ctx.fillStyle = fillColor;
      ctx.fillRect(x, y, barW * hpRatio, barH);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${player.icon} ${Math.max(0, Math.ceil(player.hp))} / ${player.maxHp}`, w / 2, y + 16);
    }

    function projectWorldPoint(wx, wy, wz, fov, horizon, w, h) {
      const dx = wx - player.x;
      const dy = wy - player.y;
      const dist = Math.hypot(dx, dy);
      let angleDiff = Math.atan2(dy, dx) - player.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      if (Math.abs(angleDiff) > fov * 0.75 || dist < 0.2) return null;
      const sx = ((angleDiff / fov) + 0.5) * w;
      const sy = horizon + (wz / Math.max(0.25, dist)) * (h * 0.35);
      return { sx, sy, dist };
    }

    function draw3DTracers(fov, horizon, w, h, zBuffer) {
      for (const tr of tracers) {
        const p1 = projectWorldPoint(tr.x1, tr.y1, 0.15, fov, horizon, w, h);
        const p2 = projectWorldPoint(tr.x2, tr.y2, 0.05, fov, horizon, w, h);
        if (!p1 && !p2) continue;

        const start = p1 || { sx: w * 0.5, sy: horizon + 30, dist: 1 };
        const end = p2 || { sx: start.sx, sy: start.sy, dist: start.dist };
        const col = Math.max(0, Math.min(w - 1, Math.floor(start.sx)));
        if (start.dist > zBuffer[col] + 0.8) continue;

        const alpha = Math.max(0.15, tr.life / tr.maxLife);
        ctx.save();
        ctx.strokeStyle = tr.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(start.sx, start.sy);
        ctx.lineTo(end.sx, end.sy);
        ctx.stroke();

        // 弾の先端に撃ったアイコンを小さく表示
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(tr.shooterIcon, start.sx, start.sy - 10);
        ctx.restore();
      }
    }

    function drawHitDirectionIndicator(w, h) {
      if (!lastHitBy) return;
      const alpha = Math.min(0.9, lastHitBy.life);
      const cx = w / 2;
      const cy = h / 2;
      const radius = 84;
      const ix = cx + Math.cos(lastHitBy.angleDiff) * radius;
      const iy = cy + Math.sin(lastHitBy.angleDiff) * radius;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.arc(ix, iy, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(lastHitBy.icon, ix, iy);
      ctx.restore();
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const fov = Math.PI / 3;
      const horizon = Math.max(40, Math.min(h - 40, h / 2 + player.z * 110));
      const zBuffer = new Array(w).fill(Infinity);

      // 快晴の青空
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
      skyGrad.addColorStop(0, "#0284c7");
      skyGrad.addColorStop(0.65, "#38bdf8");
      skyGrad.addColorStop(1, "#bae6fd");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, horizon);

      // 太陽と雲
      const sunX = w * 0.78;
      const sunY = Math.max(55, horizon * 0.28);
      ctx.fillStyle = "rgba(255, 250, 205, 0.35)";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 46, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fffbeb";
      ctx.beginPath();
      ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
      ctx.beginPath();
      ctx.arc(w * 0.24, sunY + 10, 22, 0, Math.PI * 2);
      ctx.arc(w * 0.27, sunY + 6, 28, 0, Math.PI * 2);
      ctx.arc(w * 0.30, sunY + 12, 20, 0, Math.PI * 2);
      ctx.fill();

      // 明るい屋外グラウンド
      const groundGrad = ctx.createLinearGradient(0, horizon, 0, h);
      groundGrad.addColorStop(0, "#cbd5e1");
      groundGrad.addColorStop(1, "#94a3b8");
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, horizon, w, h - horizon);

      for (let col = 0; col < w; col++) {
        const cameraX = (col / w) * 2 - 1;
        const rayAngle = player.angle + cameraX * (fov / 2);
        const eyeX = Math.cos(rayAngle);
        const eyeY = Math.sin(rayAngle);

        let dist = 0;
        let hitType = 0;
        const stepSize = 0.035;

        while (hitType === 0 && dist < 42) {
          dist += stepSize;
          const rx = player.x + eyeX * dist;
          const ry = player.y + eyeY * dist;
          const mx = Math.floor(rx);
          const my = Math.floor(ry);
          if (my < 0 || my >= MAP_H || mx < 0 || mx >= MAP_W) {
            hitType = 1;
          } else if (MAP[my][mx] > 0) {
            hitType = MAP[my][mx];
          }
        }

        const perpDist = Math.max(0.05, dist * Math.cos(rayAngle - player.angle));
        zBuffer[col] = perpDist;

        const wallScale = hitType === 2 ? 0.65 : 1.0;
        const lineHeight = Math.min(h * 1.8, (h * wallScale) / perpDist);
        const drawStart = horizon - lineHeight / 2;
        const bright = Math.max(0.55, Math.min(1.0, 1.05 - perpDist * 0.012));

        if (hitType === 2) {
          ctx.fillStyle = `rgb(${Math.floor(245 * bright)}, ${Math.floor(175 * bright)}, ${Math.floor(70 * bright)})`;
        } else {
          ctx.fillStyle = `rgb(${Math.floor(236 * bright)}, ${Math.floor(244 * bright)}, ${Math.floor(252 * bright)})`;
        }
        ctx.fillRect(col, drawStart, 1, lineHeight);
      }

      const renderables = [];
      for (const bot of rivals) {
        renderables.push({
          kind: "rival",
          icon: bot.icon,
          x: bot.x,
          y: bot.y,
          dist: Math.hypot(bot.x - player.x, bot.y - player.y)
        });
      }
      if (p2.active) {
        renderables.push({
          kind: "p2",
          icon: p2.icon,
          x: p2.x,
          y: p2.y,
          dist: Math.hypot(p2.x - player.x, p2.y - player.y)
        });
      }
      for (const pack of healthPacks) {
        renderables.push({
          kind: "heal",
          x: pack.x,
          y: pack.y,
          pulse: pack.pulse,
          dist: Math.hypot(pack.x - player.x, pack.y - player.y)
        });
      }
      for (const sm of smokes) {
        renderables.push({
          kind: "smoke",
          x: sm.x,
          y: sm.y,
          radius: sm.radius,
          life: sm.life,
          dist: Math.hypot(sm.x - player.x, sm.y - player.y)
        });
      }
      renderables.sort((a, b) => b.dist - a.dist);

      for (const item of renderables) {
        const dx = item.x - player.x;
        const dy = item.y - player.y;
        let angleDiff = Math.atan2(dy, dx) - player.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;

        if (Math.abs(angleDiff) < fov * 0.75 && item.dist > 0.25) {
          const screenX = ((angleDiff / fov) + 0.5) * w;
          const centerCol = Math.floor(screenX);

          if (centerCol >= 0 && centerCol < w && item.dist < zBuffer[centerCol]) {
            if (item.kind === "rival" || item.kind === "p2") {
              const size = Math.min(h * 0.85, (h * 0.65) / item.dist);
              ctx.fillStyle = item.kind === "p2" ? "#7c3aed" : "#ef4444";
              ctx.fillRect(screenX - size * 0.22, horizon - size * 0.15, size * 0.44, size * 0.55);

              const iconPx = Math.max(14, Math.min(44, size * 0.34));
              ctx.font = `${iconPx}px sans-serif`;
              ctx.textAlign = "center";
              ctx.fillText(item.icon, screenX, horizon - size * 0.24);
            } else if (item.kind === "heal") {
              const floatY = Math.sin(item.pulse) * 4;
              const boxSize = Math.min(h * 0.45, (h * 0.26) / item.dist);
              const py = horizon + boxSize * 0.45 + floatY;

              ctx.fillStyle = "#16a34a";
              ctx.fillRect(screenX - boxSize * 0.4, py - boxSize * 0.4, boxSize * 0.8, boxSize * 0.8);

              ctx.fillStyle = "#ffffff";
              ctx.fillRect(screenX - boxSize * 0.1, py - boxSize * 0.28, boxSize * 0.2, boxSize * 0.56);
              ctx.fillRect(screenX - boxSize * 0.28, py - boxSize * 0.1, boxSize * 0.56, boxSize * 0.2);
            } else if (item.kind === "smoke") {
              const alpha = Math.min(0.88, (item.life / 1.5) * 0.88);
              const smokeSize = Math.min(h * 1.2, (h * (item.radius * 0.85)) / item.dist);
              ctx.fillStyle = `rgba(241, 245, 249, ${alpha})`;
              ctx.beginPath();
              ctx.arc(screenX, horizon, smokeSize * 0.55, 0, Math.PI * 2);
              ctx.arc(screenX - smokeSize * 0.28, horizon + smokeSize * 0.1, smokeSize * 0.42, 0, Math.PI * 2);
              ctx.arc(screenX + smokeSize * 0.28, horizon + smokeSize * 0.1, smokeSize * 0.42, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      // 3D空間上の弾道を描画
      draw3DTracers(fov, horizon, w, h, zBuffer);

      drawWeapon(w, h);

      if (muzzleFlash > 0) {
        ctx.fillStyle = "rgba(255, 245, 150, 0.16)";
        ctx.fillRect(0, 0, w, h);
      }
      if (damageFlash > 0) {
        ctx.fillStyle = `rgba(239, 68, 68, ${damageFlash * 1.1})`;
        ctx.fillRect(0, 0, w, h);
      }
      if (healFlash > 0) {
        ctx.fillStyle = `rgba(34, 197, 94, ${healFlash * 0.9})`;
        ctx.fillRect(0, 0, w, h);
      }

      drawHitDirectionIndicator(w, h);

      const cx = w / 2;
      const cy = h / 2;
      ctx.strokeStyle = hitMarker > 0 ? "#dc2626" : "#0f172a";
      ctx.lineWidth = hitMarker > 0 ? 3 : 2;
      ctx.beginPath();
      ctx.moveTo(cx - 12, cy);
      ctx.lineTo(cx - 4, cy);
      ctx.moveTo(cx + 4, cy);
      ctx.lineTo(cx + 12, cy);
      ctx.moveTo(cx, cy - 12);
      ctx.lineTo(cx, cy - 4);
      ctx.moveTo(cx, cy + 4);
      ctx.lineTo(cx, cy + 12);
      ctx.stroke();

      drawPlayerHpBar(w, h);

      // ミニマップ（弾道ラインも反映）
      const mapSize = 148;
      const pad = 12;
      const cell = mapSize / MAP_W;
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.fillRect(pad, pad, mapSize, mapSize);
      ctx.strokeStyle = "#0284c7";
      ctx.strokeRect(pad, pad, mapSize, mapSize);

      for (let r = 0; r < MAP_H; r++) {
        for (let c = 0; c < MAP_W; c++) {
          if (MAP[r][c] === 1) {
            ctx.fillStyle = "#475569";
            ctx.fillRect(pad + c * cell, pad + r * cell, cell + 0.4, cell + 0.4);
          } else if (MAP[r][c] === 2) {
            ctx.fillStyle = "#f59e0b";
            ctx.fillRect(pad + c * cell, pad + r * cell, cell + 0.4, cell + 0.4);
          }
        }
      }

      for (const sm of smokes) {
        ctx.fillStyle = "rgba(148, 163, 184, 0.65)";
        ctx.beginPath();
        ctx.arc(pad + sm.x * cell, pad + sm.y * cell, sm.radius * cell, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const tr of tracers) {
        ctx.save();
        ctx.strokeStyle = tr.color;
        ctx.globalAlpha = Math.max(0.2, tr.life / tr.maxLife);
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(pad + tr.x1 * cell, pad + tr.y1 * cell);
        ctx.lineTo(pad + tr.x2 * cell, pad + tr.y2 * cell);
        ctx.stroke();
        ctx.restore();
      }

      for (const pack of healthPacks) {
        ctx.fillStyle = "#16a34a";
        ctx.fillRect(pad + pack.x * cell - 2.2, pad + pack.y * cell - 2.2, 4.4, 4.4);
      }

      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const bot of rivals) {
        ctx.fillText(bot.icon, pad + bot.x * cell, pad + bot.y * cell);
      }
      if (p2.active) {
        ctx.fillText(p2.icon, pad + p2.x * cell, pad + p2.y * cell);
      }

      const px = pad + player.x * cell;
      const py = pad + player.y * cell;
      ctx.font = "12px sans-serif";
      ctx.fillText(player.icon, px, py);

      ctx.strokeStyle = "#0284c7";
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(player.angle) * 11, py + Math.sin(player.angle) * 11);
      ctx.stroke();

      // 試合終了オーバーレイ（クリックやSpaceでは進まず、Rキーで再戦）
      if (matchResult && !isPrepOpen) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.80)";
        ctx.fillRect(0, 0, w, h);
        const title =
          matchResult === "WIN"
            ? `${player.icon} 25 KILLS VICTORY!`
            : matchResult === "P2_WIN"
            ? `${p2.icon} 25 KILLS VICTORY!`
            : "DEFEAT (25 KILLS)";
        ctx.fillStyle = matchResult === "LOSE" ? "#f87171" : "#4ade80";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(title, w / 2, h / 2 - 26);
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px sans-serif";
        ctx.fillText(
          `${player.icon}: ${player.kills}` + (p2.active ? `  |  ${p2.icon}: ${p2.kills}` : ""),
          w / 2,
          h / 2 + 12
        );
        ctx.font = "15px sans-serif";
        ctx.fillStyle = "#e2e8f0";
        ctx.fillText("[ R ] キーを押して再戦 ／ 上部の「準備画面」から設定変更", w / 2, h / 2 + 52);
      }
    }

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", e => {
      if (isPrepOpen) return;

      // 試合終了時は [R] キーを押したときだけ再戦へ進む
      if (matchResult) {
        if (e.code === "KeyR") {
          e.preventDefault();
          startMatchFromPrep();
        }
        return;
      }

      keys[e.code] = true;
      if (e.code === "Space") {
        e.preventDefault();
      }
      if (e.code === "KeyE" && smokeCooldown <= 0) {
        deploySmoke(player.x, player.y, player.angle);
        smokeCooldown = 6.0;
        smokeEl.textContent = "6.0s";
      }
    });
    window.addEventListener("keyup", e => {
      keys[e.code] = false;
    });

    canvas.addEventListener("click", () => {
      if (isPrepOpen) return;
      // 試合終了後のクリックでは進まないようにし、プレイ中のみ射撃＆ポインターロック
      if (matchResult) return;
      playerShoot();
      if (canvas.requestPointerLock && document.pointerLockElement !== canvas) {
        try {
          canvas.requestPointerLock();
        } catch (_) {}
      }
    });

    document.addEventListener("pointerlockchange", () => {
      if (isPrepOpen || matchResult) return;
      statusEl.textContent = document.pointerLockElement === canvas
        ? "プレイ中 (マウス視点ON)"
        : "クリックでマウス視点ON";
    });

    document.addEventListener("mousemove", e => {
      if (!isPrepOpen && document.pointerLockElement === canvas && !matchResult) {
        player.angle += e.movementX * 0.0022 * sensitivity;
      }
    });

    updateHudAndLeaderboard();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
